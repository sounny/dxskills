name: DxSkills Integrity & Regression Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Integrity & Zero Em-Dash Tests
        run: |
          python -m unittest tests/test_skills.py

      - name: Verify CLI Tools
        run: |
          python scripts/dx_cli.py --help
          python scripts/bundle_skills.py
